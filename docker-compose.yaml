version: '3.8'

services:
  # --- CONCRETE CORE: The "Void" (scratch-based) production container ---
  core:
    build: .
    image: blockmaker/concrete:latest
    container_name: concrete
    ipc: "shareable" # Enables SHM access for external consumers
    environment:
      - CONCRETE_PORT=8080
      - CONCRETE_LOG=2
    # Standard UDP mapping for ingestion and IPC triggers
    ports:
      - "8080:8080/udp" # Ingestion
      - "8081:8081/udp" # Trigger
    # Note: Traditional 'ps' healthchecks won't work in a scratch image 
    # as there is no 'ps' binary. The container lifecycle follows the process.

  # --- TESTER: The "Alpine" utility container for validation ---
  tester:
    image: alpine:latest  # <--- USAR ALPINE, NO LA IMAGEN DE CONCRETE
    container_name: tester
    depends_on:
      core:
        condition: service_started
    ipc: "service:core"
    network_mode: "service:core"
    volumes:
      - ./scripts:/app/scripts
      - ./bin:/app/bin
    working_dir: /app
    # IMPORTANTE: Forzamos el entrypoint a vacío para que 'command' funcione como queremos
    entrypoint: "" 
    command: sh ./scripts/test_functional.sh
